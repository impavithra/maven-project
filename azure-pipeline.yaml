trigger:
- main

pool:
  name: Pv-agent

stages:

# =========================================================
# STAGE 1: BUILD MAVEN APPLICATION
# =========================================================
- stage: Build
  displayName: 'Stage 1 - Build Maven Application'

  jobs:
  - job: MavenBuild
    displayName: 'Build Maven Application'

    steps:

    - checkout: self

    # -----------------------------------------------------
    # Check Java and Maven
    # -----------------------------------------------------
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # -----------------------------------------------------
    # Maven Build
    # -----------------------------------------------------
    - task: Maven@4
      displayName: 'Maven Clean Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

    # -----------------------------------------------------
    # Verify JAR
    # -----------------------------------------------------
    - script: |
        echo "Generated files:"
        ls -lh $(Build.SourcesDirectory)/target

        echo ""
        echo "Checking JAR manifest:"
        unzip -p $(Build.SourcesDirectory)/target/599-1.0.2.jar META-INF/MANIFEST.MF
      displayName: 'Verify Executable JAR'

    # -----------------------------------------------------
    # Copy JAR
    # -----------------------------------------------------
    - task: CopyFiles@2
      displayName: 'Copy Maven JAR'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/target'

    # -----------------------------------------------------
    # Copy Dockerfile
    # -----------------------------------------------------
    - task: CopyFiles@2
      displayName: 'Copy Dockerfile'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: 'Dockerfile'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # -----------------------------------------------------
    # Publish Pipeline Artifact
    # -----------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Maven Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'maven-package'


# =========================================================
# STAGE 2: PUBLISH TO AZURE ARTIFACTS
# =========================================================
- stage: Publish
  displayName: 'Stage 2 - Publish to Azure Artifacts'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: PublishMaven
    displayName: 'Publish Maven Package'

    steps:

    - checkout: self

    # -----------------------------------------------------
    # Check Java and Maven
    # -----------------------------------------------------
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # -----------------------------------------------------
    # Authenticate Azure Artifacts
    # -----------------------------------------------------
    - task: MavenAuthenticate@0
      displayName: 'Authenticate with Azure Artifacts'
      inputs:
        artifactsFeeds: 'pavip7547'

    # -----------------------------------------------------
    # Publish Maven Package
    # -----------------------------------------------------
    - task: Maven@4
      displayName: 'Publish Maven Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'deploy'
        publishJUnitResults: false
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'


# =========================================================
# STAGE 3: BUILD AND PUSH DOCKER IMAGE
# =========================================================
- stage: Docker
  displayName: 'Stage 3 - Build and Push Docker Image'

  dependsOn:
  - Build
  - Publish

  condition: succeeded()

  jobs:
  - job: DockerBuildPush
    displayName: 'Build and Push Docker Image'

    steps:

    # -----------------------------------------------------
    # Download Build Artifact
    # -----------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Maven Build Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'maven-package'
        targetPath: '$(Build.SourcesDirectory)'

    # -----------------------------------------------------
    # Verify downloaded files
    # -----------------------------------------------------
    - script: |
        echo "Downloaded files:"
        find $(Build.SourcesDirectory) -maxdepth 3 -type f -print
      displayName: 'Check Downloaded Artifact'

    # -----------------------------------------------------
    # Check Docker
    # -----------------------------------------------------
    - script: |
        docker --version
        docker info
      displayName: 'Check Docker'

    # -----------------------------------------------------
    # Build and Push Image
    # -----------------------------------------------------
    - task: Docker@2
      displayName: 'Build and Push Docker Image to ACR'
      inputs:
        command: buildAndPush
        containerRegistry: 'acr-connection'
        repository: 'maven-webapp'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest


# =========================================================
# STAGE 4: PULL, RUN AND VERIFY CONTAINER
# =========================================================
- stage: RunAndVerify
  displayName: 'Stage 4 - Pull Run and Verify Container'

  dependsOn: Docker
  condition: succeeded()

  jobs:
  - job: RunContainer
    displayName: 'Run and Verify Docker Container'

    steps:

    # -----------------------------------------------------
    # Check Docker
    # -----------------------------------------------------
    - script: |
        docker --version
        docker info
      displayName: 'Check Docker'

    # -----------------------------------------------------
    # Login to ACR
    # -----------------------------------------------------
    - task: AzureCLI@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        azureSubscription: 'b13'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Logging into ACR..."
          az acr login --name abc20092025acr

    # -----------------------------------------------------
    # Pull Latest Image
    # -----------------------------------------------------
    - script: |
        echo "Pulling latest image..."
        docker pull abc20092025acr.azurecr.io/maven-webapp:latest
      displayName: 'Pull Docker Image from ACR'

    # -----------------------------------------------------
    # Remove Existing Container
    # -----------------------------------------------------
    - script: |
        echo "Removing old container if it exists..."
        docker rm -f maven-webapp 2>/dev/null || true
      displayName: 'Remove Existing Container'

    # -----------------------------------------------------
    # Run Container
    # -----------------------------------------------------
    - script: |
        echo "Starting container..."

        docker run -d \
          --name maven-webapp \
          abc20092025acr.azurecr.io/maven-webapp:latest

      displayName: 'Run Docker Container'

    # -----------------------------------------------------
    # Wait for Application
    # -----------------------------------------------------
    - script: |
        echo "Waiting for container to finish..."
        sleep 5
      displayName: 'Wait for Container'

    # -----------------------------------------------------
    # Verify Container
    # -----------------------------------------------------
    - script: |
        echo "======================================"
        echo "DOCKER PS -A"
        echo "======================================"

        docker ps -a

        echo ""
        echo "======================================"
        echo "CONTAINER LOGS"
        echo "======================================"

        docker logs maven-webapp

        echo ""
        echo "======================================"
        echo "CONTAINER STATE"
        echo "======================================"

        STATUS=$(docker inspect maven-webapp \
          --format='{{.State.Status}}')

        EXIT_CODE=$(docker inspect maven-webapp \
          --format='{{.State.ExitCode}}')

        echo "Status    : $STATUS"
        echo "Exit Code : $EXIT_CODE"

        echo ""
        echo "======================================"
        echo "VERIFYING APPLICATION OUTPUT"
        echo "======================================"

        LOGS=$(docker logs maven-webapp 2>&1)

        if echo "$LOGS" | grep -q "Hello World!"; then
          echo "SUCCESS: Application output verified."
        else
          echo "ERROR: Expected 'Hello World!' was not found."
          exit 1
        fi

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "SUCCESS: Container exited successfully."
        else
          echo "ERROR: Container exited with code $EXIT_CODE."
          exit 1
        fi

        echo ""
        echo "======================================"
        echo "DOCKER VERIFICATION SUCCESSFUL"
        echo "======================================"

    # -----------------------------------------------------
    # Cleanup
    # -----------------------------------------------------
    - script: |
        docker rm -f maven-webapp 2>/dev/null || true
      displayName: 'Cleanup Container'
      condition: always()