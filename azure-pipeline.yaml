trigger:
- main

pool:
  name: Pv-agent

stages:

# =========================================================
# STAGE 1: BUILD MAVEN APPLICATION
# =========================================================
- stage: Build
  displayName: 'Stage 1 - Build Maven Project'

  jobs:
  - job: MavenBuild
    displayName: 'Build Maven Application'

    steps:

    # -----------------------------------------------------
    # Checkout source code
    # -----------------------------------------------------
    - checkout: self

    # -----------------------------------------------------
    # Check Java and Maven
    # -----------------------------------------------------
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # -----------------------------------------------------
    # Build Maven project
    # -----------------------------------------------------
    - task: Maven@4
      displayName: 'Maven Clean Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

    # -----------------------------------------------------
    # Show generated files
    # -----------------------------------------------------
    - script: |
        echo "Generated files:"
        ls -lh $(Build.SourcesDirectory)/target
      displayName: 'Check Generated JAR'

    # -----------------------------------------------------
    # Copy JAR to artifact staging directory
    # -----------------------------------------------------
    - task: CopyFiles@2
      displayName: 'Copy Maven JAR'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/target'

    # -----------------------------------------------------
    # Copy Dockerfile
    # -----------------------------------------------------
    - task: CopyFiles@2
      displayName: 'Copy Dockerfile'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: 'Dockerfile'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # -----------------------------------------------------
    # Show artifact contents
    # -----------------------------------------------------
    - script: |
        echo "Artifact staging directory:"
        find $(Build.ArtifactStagingDirectory) -maxdepth 3 -type f -print
      displayName: 'Check Build Artifact'

    # -----------------------------------------------------
    # Publish JAR + Dockerfile
    # -----------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Maven Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'maven-package'


# =========================================================
# STAGE 2: DOCKER BUILD AND PUSH TO ACR
# =========================================================
- stage: Docker
  displayName: 'Stage 2 - Build and Push Docker Image'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuildPush
    displayName: 'Build and Push Docker Image'

    steps:

    # -----------------------------------------------------
    # Download artifact from Stage 1
    # -----------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Maven Build Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'maven-package'
        targetPath: '$(Build.SourcesDirectory)'

    # -----------------------------------------------------
    # Check downloaded artifact
    # -----------------------------------------------------
    - script: |
        echo "Downloaded artifact contents:"
        find $(Build.SourcesDirectory) -maxdepth 3 -type f -print
      displayName: 'Check Downloaded Artifact'

    # -----------------------------------------------------
    # Check Docker installation
    # -----------------------------------------------------
    - script: |
        echo "Docker version:"
        docker --version

        echo "Docker context:"
        docker context show

        echo "Available Docker contexts:"
        docker context ls
      displayName: 'Check Docker'

    # -----------------------------------------------------
    # Configure Colima Docker socket
    # -----------------------------------------------------
    - script: |
        echo "Setting Colima Docker socket..."

        export DOCKER_HOST=unix:///Users/pavi/.colima/default/docker.sock

        echo "DOCKER_HOST=$DOCKER_HOST"

        echo "Testing Docker connection..."
        docker info
      displayName: 'Connect to Colima Docker'

    # -----------------------------------------------------
    # Build and Push Docker Image to ACR
    # -----------------------------------------------------
    - task: Docker@2
      displayName: 'Build and Push Docker Image to ACR'
      inputs:
        command: buildAndPush
        containerRegistry: 'acr-connection'
        repository: 'maven-webapp'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
      env:
        DOCKER_HOST: unix:///Users/pavi/.colima/default/docker.sock