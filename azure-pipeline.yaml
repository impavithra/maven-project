trigger:
- main

pool:
  name: Pv-agent

stages:

# =========================================================
# STAGE 1: BUILD
# =========================================================
- stage: Build
  displayName: 'Stage 1 - Build Maven Project'

  jobs:
  - job: MavenBuild
    displayName: 'Build Maven Application'

    steps:

    - checkout: self

    # Check Java and Maven
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # Build Maven project
    - task: Maven@4
      displayName: 'Maven Clean Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

    # Copy generated JAR
    - task: CopyFiles@2
      displayName: 'Copy Maven JAR'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # Publish pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'maven-package'


# =========================================================
# STAGE 2: PUBLISH TO AZURE ARTIFACTS
# =========================================================
- stage: Publish
  displayName: 'Stage 2 - Publish to Azure Artifacts'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: PublishMaven
    displayName: 'Publish Maven Package'

    steps:

    - checkout: self

    # Check Java and Maven
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # Authenticate with Azure Artifacts feed
    - task: MavenAuthenticate@0
      displayName: 'Authenticate with Azure Artifacts'
      inputs:
        artifactsFeeds: 'pavip7547'

    # Publish Maven package
    - task: Maven@4
      displayName: 'Publish Maven Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'deploy'
        publishJUnitResults: false
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'