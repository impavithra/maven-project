trigger:
- main

pool:
  name: Pv-agent

stages:

# =========================================================
# STAGE 1: BUILD MAVEN APPLICATION
# =========================================================
- stage: Build
  displayName: 'Stage 1 - Build Maven Project'

  jobs:
  - job: MavenBuild
    displayName: 'Build Maven Application'

    steps:

    - checkout: self

    # Check Java and Maven
    - script: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        mvn -version
      displayName: 'Check Java and Maven'

    # Build Maven project
    - task: Maven@4
      displayName: 'Maven Clean Package'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

    # Show generated JAR
    - script: |
        echo "Generated files:"
        ls -lh $(Build.SourcesDirectory)/target
      displayName: 'Check Generated JAR'

    # Copy generated JAR
    - task: CopyFiles@2
      displayName: 'Copy Maven JAR'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/target'

    # Copy Dockerfile
    - task: CopyFiles@2
      displayName: 'Copy Dockerfile'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: 'Dockerfile'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    # Publish JAR + Dockerfile as pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'maven-package'


# =========================================================
# STAGE 2: DOCKER BUILD AND PUSH TO ACR
# =========================================================
- stage: Docker
  displayName: 'Stage 2 - Build and Push Docker Image'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuildPush
    displayName: 'Build and Push Docker Image'

    steps:

    # Download artifact from Stage 1
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Maven Build Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'maven-package'
        targetPath: '$(Build.SourcesDirectory)'

    # Check downloaded files
    - script: |
        echo "Downloaded files:"
        find $(Build.SourcesDirectory) -maxdepth 3 -type f -print
      displayName: 'Check Downloaded Artifact'

    # Build and push Docker image
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        containerRegistry: 'YOUR-ACR-SERVICE-CONNECTION'
        repository: 'maven-webapp'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest